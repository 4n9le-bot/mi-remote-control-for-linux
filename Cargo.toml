[package]
name = "atvv-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ATVV Remote to Voxtype voice bridge"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
