[package]
name = "atvv-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ATVV Remote to Voxtype voice bridge"
license = "MIT"

[dependencies]
async-channel = "2"
async-io = "2"
clap = { version = "4.5", features = ["derive"] }
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "2"
toml = "0.9"
zbus = "=5.9.0"

[dev-dependencies]
tempfile = "3"
