[package]
name = "atvv-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "ATVV Remote to Voxtype voice bridge"
license = "MIT"

[dependencies]
async-channel = "2"
async-io = "2"
futures-lite = "2"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
tempfile = "3"
toml = "0.9"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
zbus = "=5.9.0"
gtk = { version = "0.10.3", package = "gtk4", optional = true }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"], optional = true }
ksni = { version = "=0.3.4", default-features = false, features = ["async-io", "blocking"], optional = true }

[features]
default = ["desktop"]
desktop = ["dep:adw", "dep:gtk", "dep:ksni"]

[[bin]]
name = "atvv-bridge"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "atvv-button-mapping-helper"
path = "src/bin/atvv-button-mapping-helper.rs"
