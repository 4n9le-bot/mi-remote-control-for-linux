[package]
name = "atvv-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ATVV Remote to Voxtype voice bridge"
license = "MIT"

[dependencies]
async-channel = "2"
async-io = "2"
clap = { version = "4.5", features = ["derive"] }
futures-lite = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "2"
tempfile = "3"
toml = "0.9"
zbus = "=5.9.0"
gtk = { version = "0.10.3", package = "gtk4", optional = true }
adw = { version = "0.8", package = "libadwaita", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:adw", "dep:gtk"]
