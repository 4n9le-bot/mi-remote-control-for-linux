name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev fakeroot jq systemd
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.85.0 fmt --check
      - name: Typecheck
        run: cargo +1.85.0 check --all-targets --locked
      - name: Run Rust tests
        run: cargo +1.85.0 test --locked
      - name: Verify Debian package
        run: tests/debian-package.sh
